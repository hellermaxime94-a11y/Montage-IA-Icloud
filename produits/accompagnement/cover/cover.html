<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couverture Accompagnement</title>
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
  @font-face { font-family: "Oswald"; src: url("fonts/Oswald.ttf"); font-weight: 700; }
  :root {
    --w: 1600px; --h: 1170px;
    --ice: #e6f6ff; --sky: #7fd3ff; --blue: #2f8cff; --deep: #0b3fae; --night: #061a4d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  #stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: #000; }
  canvas, svg { position: absolute; inset: 0; }

  /* NOM en relief */
  .name-wrap {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%) rotate(-5deg) skewX(-11deg);
  }
  .name {
    position: relative;
    font-family: "Anton", sans-serif; font-size: 300px; line-height: 1; letter-spacing: 4px;
    white-space: nowrap; color: transparent;
  }
  .name .extrude {
    position: absolute; inset: 0; color: #041038;
    text-shadow:
      2px 2px 0 #0a2a7a, 4px 4px 0 #0a2a7a, 6px 6px 0 #092570, 8px 8px 0 #082166,
      10px 10px 0 #071d5c, 12px 12px 0 #061a52, 14px 14px 0 #051648, 16px 16px 0 #04123e,
      18px 18px 0 #030e34, 20px 20px 30px rgba(0,0,0,.9),
      0 0 60px rgba(47,140,255,.55), 0 0 120px rgba(47,140,255,.35);
  }
  .name .face {
    position: relative;
    background: linear-gradient(180deg, #f2fbff 0%, #a9e2ff 22%, #4aa8ff 52%, #1f6fe8 74%, #2f9bff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-stroke: 2px rgba(225,245,255,.85);
  }
  .name .shine {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 55%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1600" height="1170"></canvas>

  <!-- Anneau derrière le texte -->
  <svg viewBox="0 0 1600 1170" width="1600" height="1170">
    <defs>
      <linearGradient id="ringG" x1="0" x2="1">
        <stop offset="0" stop-color="#7fd3ff" stop-opacity=".2"/>
        <stop offset=".35" stop-color="#bfe9ff"/>
        <stop offset=".7" stop-color="#2f8cff"/>
        <stop offset="1" stop-color="#7fd3ff" stop-opacity=".3"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g transform="rotate(-10 800 560)" filter="url(#glow)">
      <ellipse cx="800" cy="560" rx="690" ry="250" fill="none" stroke="url(#ringG)" stroke-width="4"/>
      <ellipse cx="800" cy="560" rx="676" ry="238" fill="none" stroke="#2f8cff" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
  </svg>

  <div class="name-wrap">
    <div class="name">
      <span class="extrude" id="n1">MAXIME</span>
      <span class="face" id="n2">MAXIME</span>
      <span class="shine" id="n3">MAXIME</span>
    </div>
  </div>

  <!-- Bannière -->
  <svg viewBox="0 0 1600 1170" width="1600" height="1170">
    <defs>
      <linearGradient id="ribG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d62d6"/>
        <stop offset=".5" stop-color="#0d3c9e"/>
        <stop offset="1" stop-color="#071f63"/>
      </linearGradient>
      <linearGradient id="tailG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0c348a"/>
        <stop offset="1" stop-color="#04123d"/>
      </linearGradient>
      <linearGradient id="txtG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".6" stop-color="#bfe9ff"/>
        <stop offset="1" stop-color="#7fc4ff"/>
      </linearGradient>
      <path id="ribPath" d="M 370 830 Q 800 690 1230 780"/>
      <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".8"/>
        <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#2f8cff" flood-opacity=".55"/>
      </filter>
    </defs>
    <g filter="url(#soft)">
      <!-- queues -->
      <path d="M 300 800 L 395 772 L 410 862 L 315 890 L 345 845 Z" fill="url(#tailG)" stroke="#5fb6ff" stroke-width="2"/>
      <path d="M 1300 752 L 1205 735 L 1195 826 L 1290 842 L 1265 796 Z" fill="url(#tailG)" stroke="#5fb6ff" stroke-width="2"/>
      <!-- corps -->
      <path d="M 365 770 Q 800 630 1235 728 L 1225 830 Q 800 735 378 868 Z"
            fill="url(#ribG)" stroke="#8fd6ff" stroke-width="3"/>
      <path d="M 378 782 Q 800 646 1225 740" fill="none" stroke="#cfeeff" stroke-opacity=".5" stroke-width="2"/>
    </g>
    <text font-family="Oswald" font-weight="700" font-size="74" letter-spacing="6" fill="url(#txtG)"
          stroke="#04123d" stroke-width="1.5" paint-order="stroke">
      <textPath href="#ribPath" startOffset="50%" text-anchor="middle">★  ACCOMPAGNEMENT  ★</textPath>
    </text>
  </svg>

  <canvas id="fx" width="1600" height="1170"></canvas>
</div>

<script>
// ---- Fond : nébuleuse bleue + poussière d'étoiles ----
const W = 1600, H = 1170;
const bg = document.getElementById('bg').getContext('2d');
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

bg.fillStyle = '#000'; bg.fillRect(0, 0, W, H);
const vignette = bg.createRadialGradient(W/2, H/2, 100, W/2, H/2, 950);
vignette.addColorStop(0, 'rgba(6,26,77,.55)'); vignette.addColorStop(1, 'rgba(0,0,0,0)');
bg.fillStyle = vignette; bg.fillRect(0, 0, W, H);

// filaments : traînées de particules le long de courbes qui partent des coins
function filament(x0, y0, x1, y1, cx, cy, spread, count, hueShift) {
  for (let k = 0; k < 14; k++) {
    const t = k / 13, hx = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1, hy = (1-t)*(1-t)*y0 + 2*(1-t)*t*cy + t*t*y1;
    haze(hx, hy, spread * 1.6, 0.05);
  }
  for (let i = 0; i < count; i++) {
    const t = rnd();
    const x = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1;
    const y = (1-t)*(1-t)*y0 + 2*(1-t)*t*cy + t*t*y1;
    const s = spread * (0.3 + Math.sin(t * Math.PI));
    const a = rnd() * Math.PI * 2, r = Math.pow(rnd(), 1.15) * s * 1.7;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    const alpha = 0.04 + rnd() * 0.26;
    const size = rnd() < 0.97 ? rnd() * 1.6 + 0.3 : rnd() * 3 + 1;
    const l = 45 + rnd() * 30;
    bg.fillStyle = `hsla(${208 + hueShift + rnd()*14},100%,${l}%,${alpha})`;
    bg.beginPath(); bg.arc(px, py, size, 0, Math.PI * 2); bg.fill();
  }
}
// halos diffus
function haze(x, y, r, a) {
  const g = bg.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(30,110,255,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = g; bg.fillRect(x - r, y - r, r * 2, r * 2);
}
[[150,150,380,.28],[1450,140,380,.25],[160,1030,380,.25],[1460,1040,400,.28],[800,600,520,.12]]
  .forEach(h => haze(...h));

bg.globalCompositeOperation = 'lighter';
const streams = [
  [0, 60, 620, 420, 260, 120, 110],   [40, 380, 560, 520, 220, 330, 80],
  [1600, 40, 980, 420, 1320, 120, 110],[1600, 420, 1080, 560, 1360, 380, 80],
  [0, 1130, 640, 760, 260, 1040, 110],[30, 820, 520, 700, 200, 860, 70],
  [1600, 1150, 960, 770, 1330, 1040, 110],[1600, 820, 1100, 700, 1400, 860, 70],
  [500, 0, 760, 260, 560, 140, 60],   [1120, 1170, 860, 900, 1060, 1020, 60]
];
streams.forEach(([x0,y0,x1,y1,cx,cy,sp], i) => filament(x0,y0,x1,y1,cx,cy,sp, 12000, i%2 ? 10 : -6));
// étoiles
for (let i = 0; i < 700; i++) {
  const x = rnd() * W, y = rnd() * H, s = rnd() * 1.4 + 0.2;
  bg.fillStyle = `rgba(${200+rnd()*55|0},${225+rnd()*30|0},255,${0.3 + rnd()*0.7})`;
  bg.beginPath(); bg.arc(x, y, s, 0, Math.PI * 2); bg.fill();
}
for (let i = 0; i < 18; i++) {
  const x = rnd() * W, y = rnd() * H, r = 6 + rnd() * 10;
  const g = bg.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(220,240,255,.9)'); g.addColorStop(1, 'rgba(47,140,255,0)');
  bg.fillStyle = g; bg.fillRect(x - r, y - r, r * 2, r * 2);
}
bg.globalCompositeOperation = 'source-over';

// ---- Éclat lumineux (lens flare) ----
const fx = document.getElementById('fx').getContext('2d');
function flare(x, y, len) {
  fx.globalCompositeOperation = 'lighter';
  const core = fx.createRadialGradient(x, y, 0, x, y, 70);
  core.addColorStop(0, 'rgba(255,255,255,1)'); core.addColorStop(.15, 'rgba(190,230,255,.9)');
  core.addColorStop(.5, 'rgba(47,140,255,.35)'); core.addColorStop(1, 'rgba(47,140,255,0)');
  fx.fillStyle = core; fx.fillRect(x - 70, y - 70, 140, 140);
  [[len, 3], [len * .55, 2]].forEach(([l, w], k) => {
    const ang = k ? Math.PI / 4 : 0;
    for (const a of [ang, ang + Math.PI / 2]) {
      fx.save(); fx.translate(x, y); fx.rotate(a);
      const g = fx.createLinearGradient(-l, 0, l, 0);
      g.addColorStop(0, 'rgba(120,200,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.95)');
      g.addColorStop(1, 'rgba(120,200,255,0)');
      fx.fillStyle = g; fx.fillRect(-l, -w / 2, l * 2, w); fx.restore();
    }
  });
}
document.fonts.ready.then(() => {
  // place l'éclat à droite de la dernière lettre
  const r = document.getElementById('n2').getBoundingClientRect();
  flare(r.right - 40, r.top + r.height * 0.62, 150);
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
